<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Control de Asistencia QR</title>

  <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      background: #f4f6f8;
      color: #17202a;
    }

    .contenedor {
      max-width: 600px;
      margin: auto;
      padding: 20px;
    }

    .tarjeta {
      background: white;
      border-radius: 18px;
      padding: 20px;
      box-shadow: 0 4px 20px rgba(0,0,0,.08);
    }

    h1 {
      text-align: center;
      margin: 0 0 8px;
    }

    .subtitulo {
      text-align: center;
      color: #667085;
      margin-bottom: 20px;
    }

    #reader {
      width: 100%;
    }

    #resultado {
      margin-top: 18px;
      padding: 18px;
      border-radius: 14px;
      text-align: center;
      font-size: 19px;
      font-weight: bold;
    }

    .info {
      background: #e0f2fe;
      color: #075985;
    }

    .ok {
      background: #dcfce7;
      color: #166534;
    }

    .advertencia {
      background: #fef3c7;
      color: #92400e;
    }

    .error {
      background: #fee2e2;
      color: #991b1b;
    }
  </style>
</head>

<body>

<div class="contenedor">

  <div class="tarjeta">

    <h1>📷 Control de Asistencia</h1>

    <div class="subtitulo">
      Escanea el código QR del alumno
    </div>

    <div id="reader"></div>

    <div id="resultado" class="info">
      Listo para escanear…
    </div>

  </div>

</div>

<script>

const SERVIDOR =
"https://script.google.com/macros/s/AKfycbx5yi-IVc0Jnq4nYgwzLKkYbN_g5rqu_ZqFUxxEfzqMfjXXY1GNXuAu01UFUrVO78P0ZA/exec";

let ocupado = false;


function mostrarResultado(texto, clase) {

  const elemento =
    document.getElementById("resultado");

  elemento.textContent = texto;

  elemento.className = clase;

}


function enviarQR(id) {

  if (ocupado) {
    return;
  }

  ocupado = true;

  mostrarResultado(
    "Registrando " + id + "…",
    "info"
  );


  const callback =
    "respuestaQR_" + Date.now();


  window[callback] = function(resultado) {

    if (resultado.ok) {

      mostrarResultado(
        "✓ PRESENTE — " +
        resultado.nombre +
        " — " +
        resultado.hora,
        "ok"
      );

    }

    else if (resultado.duplicado) {

      mostrarResultado(
        "⚠ YA REGISTRADO — " +
        resultado.nombre,
        "advertencia"
      );

    }

    else {

      mostrarResultado(
        "✕ " + resultado.mensaje,
        "error"
      );

    }


    delete window[callback];


    setTimeout(function() {

      ocupado = false;

      mostrarResultado(
        "Listo para escanear…",
        "info"
      );

    }, 1800);

  };


  const script =
    document.createElement("script");


  script.src =
    SERVIDOR +
    "?action=scan&id=" +
    encodeURIComponent(id) +
    "&callback=" +
    callback;


  script.onerror = function() {

    delete window[callback];

    mostrarResultado(
      "No se pudo contactar al servidor.",
      "error"
    );

    setTimeout(function() {

      ocupado = false;

      mostrarResultado(
        "Listo para escanear…",
        "info"
      );

    }, 2500);

  };


  document.body.appendChild(script);

}


function escaneoExitoso(texto) {

  const id =
    texto.trim();

  enviarQR(id);

}


function errorEscaneo(error) {

  // Es normal que aparezca mientras
  // la cámara está buscando un QR.

}


const lector =
  new Html5QrcodeScanner(

    "reader",

    {
      fps: 10,

      qrbox: {
        width: 250,
        height: 250
      },

      rememberLastUsedCamera: true
    },

    false

  );


lector.render(
  escaneoExitoso,
  errorEscaneo
);

</script>

</body>
</html>

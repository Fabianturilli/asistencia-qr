<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Control de Asistencia</title>

  <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      color: #17202a;
    }

    .app {
      max-width: 760px;
      margin: auto;
      padding: 16px;
    }

    .card {
      background: white;
      border-radius: 18px;
      padding: 18px;
      box-shadow: 0 4px 18px rgba(0,0,0,.08);
      margin-bottom: 16px;
    }

    h1, h2 {
      margin-top: 0;
    }

    .tabs {
      display: flex;
      gap: 10px;
      margin-bottom: 16px;
    }

    .tab {
      flex: 1;
      border: none;
      padding: 14px;
      border-radius: 12px;
      font-size: 16px;
      cursor: pointer;
      background: #e5e7eb;
    }

    .tab.activa {
      background: #2563eb;
      color: white;
    }

    .oculto {
      display: none;
    }

    #reader {
      width: 100%;
    }

    #resultado {
      margin-top: 16px;
      padding: 16px;
      border-radius: 12px;
      text-align: center;
      font-weight: bold;
    }

    .info {
      background: #e0f2fe;
      color: #075985;
    }

    .ok {
      background: #dcfce7;
      color: #166534;
    }

    .warn {
      background: #fef3c7;
      color: #92400e;
    }

    .bad {
      background: #fee2e2;
      color: #991b1b;
    }

    .resumen {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      margin-bottom: 18px;
    }

    .dato {
      padding: 16px;
      border-radius: 14px;
      text-align: center;
      background: #f8fafc;
    }

    .dato .numero {
      font-size: 28px;
      font-weight: bold;
    }

    .lista {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .alumno {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      padding: 12px 14px;
      border-radius: 12px;
      background: #f8fafc;
    }

    .nombre {
      font-weight: bold;
    }

    .estado-presente {
      color: #166534;
      font-weight: bold;
    }

    .estado-retardo {
      color: #92400e;
      font-weight: bold;
    }

    .estado-ausente {
      color: #991b1b;
      font-weight: bold;
    }

    .hora {
      font-size: 13px;
      color: #667085;
    }

    @media (min-width: 700px) {
      .resumen {
        grid-template-columns: repeat(4, 1fr);
      }
    }
  </style>
</head>

<body>

<div class="app">

  <div class="card">

    <h1>Control de Asistencia</h1>

    <div class="tabs">
      <button class="tab activa" onclick="mostrarVista('scanner', this)">
        📷 Escanear
      </button>

      <button class="tab" onclick="mostrarVista('grupo', this)">
        📊 Mi grupo
      </button>
    </div>

  </div>


  <div id="vistaScanner" class="card">

    <h2>Escanear asistencia</h2>

    <div id="reader"></div>

    <div id="resultado" class="info">
      Listo para escanear…
    </div>

  </div>


  <div id="vistaGrupo" class="card oculto">

    <h2>Asistencia de hoy</h2>

    <div id="fechaGrupo"></div>

    <div class="resumen">

      <div class="dato">
        <div class="numero" id="total">0</div>
        <div>👨‍🎓 Alumnos</div>
      </div>

      <div class="dato">
        <div class="numero" id="presentes">0</div>
        <div>🟢 Presentes</div>
      </div>

      <div class="dato">
        <div class="numero" id="retardos">0</div>
        <div>🟡 Retardos</div>
      </div>

      <div class="dato">
        <div class="numero" id="ausentes">0</div>
        <div>🔴 Ausentes</div>
      </div>

    </div>

    <div id="listaAlumnos" class="lista"></div>

  </div>

</div>


<script>

const SERVIDOR =
"https://script.google.com/macros/s/AKfycbx5yi-IVc0Jnq4nYgwzLKkYbN_g5rqu_ZqFUxxEfzqMfjXXY1GNXuAu01UFUrVO78P0ZA/exec";

let ocupado = false;


function mostrarVista(vista, boton) {

  document
    .querySelectorAll(".tab")
    .forEach(b => b.classList.remove("activa"));

  boton.classList.add("activa");

  if (vista === "scanner") {

    document
      .getElementById("vistaScanner")
      .classList.remove("oculto");

    document
      .getElementById("vistaGrupo")
      .classList.add("oculto");

  } else {

    document
      .getElementById("vistaScanner")
      .classList.add("oculto");

    document
      .getElementById("vistaGrupo")
      .classList.remove("oculto");

    cargarGrupo();

  }

}


function mostrarResultado(texto, clase) {

  const e =
    document.getElementById("resultado");

  e.textContent = texto;

  e.className = clase;

}


function enviarQR(id) {

  if (ocupado) return;

  ocupado = true;

  mostrarResultado(
    "Registrando " + id + "…",
    "info"
  );


  const callback =
    "respuestaQR_" + Date.now();


  window[callback] = function(r) {

    if (r.ok) {

      mostrarResultado(
        "✓ PRESENTE — " +
        r.nombre +
        " — " +
        r.hora,
        "ok"
      );

    }

    else if (r.duplicado) {

      mostrarResultado(
        "⚠ YA REGISTRADO — " +
        r.nombre,
        "warn"
      );

    }

    else {

      mostrarResultado(
        "✕ " + r.mensaje,
        "bad"
      );

    }


    delete window[callback];


    setTimeout(function() {

      ocupado = false;

      mostrarResultado(
        "Listo para escanear…",
        "info"
      );

    }, 1800);

  };


  const script =
    document.createElement("script");


  script.src =
    SERVIDOR +
    "?action=scan&id=" +
    encodeURIComponent(id) +
    "&callback=" +
    callback;


  document.body.appendChild(script);

}


function escaneoExitoso(texto) {

  enviarQR(
    texto.trim()
  );

}


function errorEscaneo(error) {

}


const lector =
  new Html5QrcodeScanner(

    "reader",

    {
      fps: 10,
      qrbox: {
        width: 250,
        height: 250
      },
      rememberLastUsedCamera: true
    },

    false

  );


lector.render(
  escaneoExitoso,
  errorEscaneo
);


function cargarGrupo() {

  const callback =
    "respuestaPanel_" + Date.now();


  window[callback] = function(datos) {

    document
      .getElementById("total")
      .textContent =
      datos.total;

    document
      .getElementById("presentes")
      .textContent =
      datos.presentes;

    document
      .getElementById("retardos")
      .textContent =
      datos.retardos;

    document
      .getElementById("ausentes")
      .textContent =
      datos.ausentes;

    document
      .getElementById("fechaGrupo")
      .textContent =
      datos.fecha;


    const lista =
      document.getElementById(
        "listaAlumnos"
      );


    lista.innerHTML = "";


    datos.alumnos.forEach(function(a) {

      const fila =
        document.createElement("div");

      fila.className =
        "alumno";


      let clase =
        "estado-ausente";

      let icono =
        "🔴";


      if (
        a.estado === "Presente"
      ) {

        clase =
          "estado-presente";

        icono =
          "🟢";

      }


      if (
        a.estado === "Retardo"
      ) {

        clase =
          "estado-retardo";

        icono =
          "🟡";

      }


      fila.innerHTML =
        "<div>" +
          "<div class='nombre'>" +
            a.nombre +
          "</div>" +

          "<div class='hora'>" +
            (a.hora || "") +
          "</div>" +
        "</div>" +

        "<div class='" +
          clase +
        "'>" +
          icono +
          " " +
          a.estado +
        "</div>";


      lista.appendChild(fila);

    });


    delete window[callback];

  };


  const script =
    document.createElement(
      "script"
    );


  script.src =
    SERVIDOR +
    "?action=hoy&callback=" +
    callback +
    "&t=" +
    Date.now();


  document.body.appendChild(
    script
  );

}


// Actualizar panel cada 10 segundos
setInterval(function() {

  const panel =
    document.getElementById(
      "vistaGrupo"
    );

  if (
    !panel.classList.contains(
      "oculto"
    )
  ) {

    cargarGrupo();

  }

}, 10000);

</script>

</body>
</html>
